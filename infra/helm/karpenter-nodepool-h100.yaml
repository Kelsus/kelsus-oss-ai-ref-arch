# H100 capacity: p5.48xlarge (8x H100 80GB, 192 vCPU) — the frontier-tier box
# for 70B+ validation and the DeepSeek/Kimi sweep. Capacity policy: SPOT
# PREFERRED, on-demand as the explicit last resort (see the requirements note
# below — this header used to say "spot only", which contradicted the actual
# values line; the recorded later decision was "progress over waiting").
# CAVEATS the next revision should address (from the 2026-07-01 review):
#   * p4d.24xlarge is 8x A100-40G = 320GB VRAM — models >~300GB (Nemotron NVFP4,
#     Qwen3-VL, DeepSeek-AWQ) OOM-crashloop if Karpenter picks it cheapest-first.
#     Big-model manifests should pin p5.48xlarge, or this pool should split.
#   * with p4d dropped, the OD worst case is p5 ~$55-98/hr, not the ~$33/hr p4d
#     figure the note below was approved against.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-h100
spec:
  template:
    metadata:
      labels:
        workload: inference
        tier: h100
        nvidia.com/gpu.present: "true"
    spec:
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      requirements:
        # All viable 8-GPU boxes, spot-only; Karpenter takes the cheapest pool
        # with capacity (typically p4d ~$8-12/hr before p5 ~$20-30/hr). More
        # types = more spot pools = capacity actually lands (the fleet API
        # itself recommends >=5 types for spot flexibility).
        # spot preferred on price; on-demand is the explicit last resort so a
        # region-wide spot drought can't stall the benchmark (Jon: progress
        # over waiting; worst case ~$33/hr p4d OD, within the approved envelope).
        - { key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand] }
        - { key: node.kubernetes.io/instance-type, operator: In, values: [p5.48xlarge, p4d.24xlarge, p4de.24xlarge] }
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      expireAfter: 720h
  # Exactly one p5.48xlarge — this is a benchmark box, not a fleet.
  limits:
    cpu: "192"
    memory: 2000Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
